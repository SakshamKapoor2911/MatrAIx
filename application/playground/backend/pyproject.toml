[project]
name = "matraix-playground-backend"
version = "0.1.0"
description = "MatrAIx Playground backend service and reporting engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "fpdf2>=2.7.0",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
    "uvicorn>=0.38.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "backend.api", "backend.service"]

[tool.setuptools.package-dir]
backend = "."
