services:
  support-bot:
    build:
      context: support-bot
    ports:
    - 127.0.0.1:8901:8000
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health',
        timeout=2).read()
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
